maintenance_interval: 100
maintenance_command: "lms unload --all && lms load --context-length 32768 --identifier google/gemma-4-26b-a4b -y google/gemma-4-26b-a4b"

systems:
  - name: agentic_pipeline
    vlm_base_url: http://127.0.0.1:1234/v1
    vlm_model: google/gemma-4-26b-a4b
    vlm_api_key: lm-studio
    vlm_max_tokens: 16000
    vlm_parse_error_retries: 2
    segmentation_prompt_style: detailed
    max_steps: 3
    include_prompt_history: true

datasets:
  - name: fsc147
    root: data/fsc147
    split: test

iou_threshold: 0.5
seed: 123
attribution: false
out_dir: results/fixed_agentic
sample_limit: 1000
sample_strategy: head
