systems:
  - name: sequential_pipeline
    vlm_base_url: http://127.0.0.1:1234/v1
    vlm_model: google/gemma-4-e4b
    vlm_api_key: lm-studio
    vlm_max_tokens: 4096
    segmentation_prompt_style: short

  - name: agentic_pipeline
    vlm_base_url: http://127.0.0.1:1234/v1
    vlm_model: google/gemma-4-e4b
    vlm_api_key: lm-studio
    vlm_max_tokens: 4096
    segmentation_prompt_style: short
    max_steps: 3
    include_prompt_history: false

datasets:
  - name: refcocog
    root: data/refcocog
    split: val
    split_by: umd

  - name: fsc147
    root: data/fsc147
    split: test

iou_threshold: 0.5
seed: 123
attribution: false
out_dir: results/full_vlm_short
sample_limit: null
sample_strategy: head
